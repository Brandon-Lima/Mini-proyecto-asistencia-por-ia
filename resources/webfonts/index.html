<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error 404</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .contenedor {
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 90%;
      }

      .contenedor h1 {
        font-size: 100px;
        margin-bottom: 10px;
        color: #ffd166;
      }

      .contenedor h2 {
        font-size: 28px;
        margin-bottom: 15px;
      }

      .contenedor p {
        font-size: 16px;
        margin-bottom: 25px;
        color: #f1f1f1;
      }

      .boton {
        display: inline-block;
        text-decoration: none;
        background: #ffd166;
        color: #222;
        padding: 12px 25px;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s ease;
      }

      .boton:hover {
        background: #ffb703;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h1>404</h1>
      <h2>Página no encontrada</h2>
      <p>Lo sentimos, la página que estás buscando no existe o fue movida.</p>
      <a href="index.html" class="boton">Volver al inicio</a>
    </div>
  </body>
</html>
