<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Asistente IA - Reportes</title>

  <link rel="icon" href="resources/image/ia.png">

  <link rel="stylesheet" href="resources/css/bootstrap.min.css">
  <link rel="stylesheet" href="resources/css/all.min.css">
  <link rel="stylesheet" href="resources/css/style.css">
</head>

<body>

  <nav class="navbar navbar-dark navbar-custom mb-4">
    <span class="navbar-brand mb-0 h1">
      <i class="fas fa-chart-line mr-2"></i> Reportes E-commerce & IA
    </span>
  </nav>

  <div class="container-fluid px-4">
    <div class="row mb-4">
      <div class="col-md-12 text-center">
        <h4>Análisis de Catálogo de Productos</h4>
        <p class="text-muted">Obtén métricas en tiempo real y recomendaciones generadas por IA.</p>
        <button id="boton_Generar" class="btn btn-primary btn-lg shadow">
          <i class="fas fa-robot mr-2"></i> Generar Reporte con IA
        </button>

        <div id="cargando_datos" class="mt-3" style="display:none;">
          <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Cargando...</span>
          </div>
          <p class="mt-2 text-muted">Procesando datos del catálogo...</p>
        </div>
      </div>
    </div>

    <div id="informe_ia" style="display: none;">

      <div class="row mb-4">
        <div class="col-md-12">
          <div class="card shadow-sm ai-result-card">
            <div class="card-body">
              <div class="d-flex align-items-center mb-3">
                <i class="fas fa-brain ai-icon mr-3"></i>
                <h5 class="card-title mb-0 font-weight-bold">Conclusión del Asistente IA</h5>
              </div>
              <p class="card-text text-justify" id="respuesta_ia">
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white font-weight-bold">
              <i class="fas fa-pie-chart text-info mr-2"></i> Distribución de Productos
            </div>
            <div class="card-body">
              <div class="chart-container">
                <canvas id="chartPie"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white font-weight-bold">
              <i class="fas fa-chart-bar text-success mr-2"></i> Precio Promedio ($)
            </div>
            <div class="card-body">
              <div class="chart-container">
                <canvas id="chartBar"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4 mb-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white font-weight-bold">
              <i class="fas fa-star text-warning mr-2"></i> Interacciones (Ratings Totales)
            </div>
            <div class="card-body">
              <div class="chart-container">
                <canvas id="chartDoughnut"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="resources/js/jquery-3.5.1.min.js"></script>
  <script src="resources/js/popper.min.js"></script>
  <script src="resources/js/bootstrap.min.js"></script>
  <script src="resources/js/chart.js"></script>
  <script src="config.js"></script>
  <script src="reporte-ia.js"></script>

</body>

</html>
